name: Sync Saatchi Art catalog

on:
  schedule: [{cron: "17 6 * * *"}]
  workflow_dispatch: {}
  push: {paths: ["scripts/scrape.mjs"]}
permissions: {contents: write}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - {name: Checkout repository, uses: actions/checkout@v4}
      - {name: Setup Node, uses: actions/setup-node@v4, with: {node-version: "20"}}
      - {name: Install dependencies, run: npm install}
      - {name: Run scraper, run: npm run scrape}
      - name: Commit and push if changed
        run: git config user.name "github-actions[bot]" && git config user.email "github-actions[bot]@users.noreply.github.com" && git add docs/saatchi.json && (git diff --staged --quiet || git commit -m "Auto-update saatchi.json") && git push
