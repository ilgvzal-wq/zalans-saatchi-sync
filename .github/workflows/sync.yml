name: Sync Saatchi Art catalog

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [scripts/scrape.mjs, scripts/scrape.test.mjs, .github/workflows/sync.yml]
permissions:
  contents: write
concurrency:
  group: saatchi-catalog-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test importer
        run: node --test scripts/scrape.test.mjs
      - name: Run scraper
        run: node scripts/scrape.mjs
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/saatchi.json docs/images
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update Saatchi catalogue and images"
            git push
          fi
